<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 100 380 595" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FCFCF9" />
      <stop offset="100%" stop-color="#F2F3EC" />
    </radialGradient>

    <!-- Main Body Gradient (Pristine Pearly White with Soft Enamel Shading) -->
    <linearGradient id="bodyGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FAFCFD" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Body Specular Highlight Overlay -->
    <radialGradient id="bodyHighlight" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Body Shadow for porcelain depth -->
    <radialGradient id="bodyShadow" cx="50%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#CBD5E1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Arm Gradients (Clean Pearl White) -->
    <linearGradient id="armGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="armGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Little Tooth Gradient -->
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>

    <!-- Tooth Shadow -->
    <radialGradient id="toothShadow" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0" />
    </radialGradient>

    <!-- Ground Drop Shadow -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#334155" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0" />
    </radialGradient>

    <!-- Tooth Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sparkle Mint & Cyan Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Eye Shine Filter -->
    <radialGradient id="eyeGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="670" rx="170" ry="28" fill="url(#dropShadow)" />

  <!-- MAIN CHARACTER GROUP -->
  <g transform="translate(0, 20)">
    <!-- SPARKLES ABOVE HEAD -->
    <path d="M 400 120 Q 400 145 425 145 Q 400 145 400 170 Q 400 145 375 145 Q 400 145 400 120 Z" 
          fill="url(#sparkleGrad)" filter="url(#glow)" />
    <path d="M 330 155 Q 330 170 345 170 Q 330 170 330 185 Q 330 170 315 170 Q 330 170 330 155 Z" 
          fill="url(#sparkleGrad)" transform="rotate(-12, 330, 170)" />
    <path d="M 470 155 Q 470 170 485 170 Q 470 170 470 185 Q 470 170 455 170 Q 470 170 470 155 Z" 
          fill="url(#sparkleGrad)" transform="rotate(12, 470, 170)" />
    <path d="M 290 190 Q 290 200 300 200 Q 290 200 290 210 Q 290 200 280 200 Q 290 200 290 190 Z" 
          fill="#2DD4BF" opacity="0.85" />
    <path d="M 510 190 Q 510 200 520 200 Q 510 200 510 210 Q 510 200 500 200 Q 510 200 510 190 Z" 
          fill="#2DD4BF" opacity="0.85" />

    <!-- BASE WHITE BODY (Cute Capsule Shield Shape with Definition) -->
    <g id="body">
      <path d="
        M 260, 340 
        C 260, 210  540, 210  540, 340
        C 540, 470  530, 560  470, 620
        C 440, 650  415, 630  400, 595
        C 385, 630  360, 650  330, 620
        C 270, 560  260, 470  260, 340 Z" 
        fill="url(#bodyGrad)"
        stroke="rgba(148, 163, 184, 0.45)"
        stroke-width="3.5"
        stroke-linejoin="round" />

      <path d="
        M 260, 340 
        C 260, 210  540, 210  540, 340
        C 540, 470  530, 560  470, 620
        C 440, 650  415, 630  400, 595
        C 385, 630  360, 650  330, 620
        C 270, 560  260, 470  260, 340 Z" 
        fill="url(#bodyShadow)" />

      <path d="
        M 260, 340 
        C 260, 210  540, 210  540, 340
        C 540, 470  530, 560  470, 620
        C 440, 650  415, 630  400, 595
        C 385, 630  360, 650  330, 620
        C 270, 560  260, 470  260, 340 Z" 
        fill="url(#bodyHighlight)" />
    </g>

    <!-- FACIAL FEATURES -->
    <g id="face">
      <!-- Left Eye -->
      <g transform="translate(330, 340)">
        <ellipse cx="0" cy="0" rx="20" ry="24" fill="url(#eyeGrad)" />
        <circle cx="-6" cy="-8" r="9" fill="#FFFFFF" />
        <circle cx="7" cy="8" r="4" fill="#FFFFFF" />
      </g>
      <!-- Right Eye -->
      <g transform="translate(470, 340)">
        <ellipse cx="0" cy="0" rx="20" ry="24" fill="url(#eyeGrad)" />
        <circle cx="-6" cy="-8" r="9" fill="#FFFFFF" />
        <circle cx="7" cy="8" r="4" fill="#FFFFFF" />
      </g>

      <!-- Rosy Blush Cheeks -->
      <ellipse cx="305" cy="370" rx="24" ry="14" fill="#FF76A0" opacity="0.5" filter="url(#glow)" />
      <ellipse cx="495" cy="370" rx="24" ry="14" fill="#FF76A0" opacity="0.5" filter="url(#glow)" />

      <!-- Cute Happy Smile -->
      <path d="M 370 365 Q 400 395 430 365" fill="none" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round" />
    </g>

    <!-- HUGGING ARMS AND LITTLE TOOTH -->
    <g id="holding-tooth">
      <ellipse cx="400" cy="525" rx="55" ry="20" fill="#64748B" opacity="0.15" />

      <!-- Back of Left Arm -->
      <path d="M 262 440 C 230 450 240 540 315 540 C 335 540 350 520 345 500 C 340 480 300 460 262 440 Z" 
            fill="url(#armGradLeft)"
            stroke="rgba(148, 163, 184, 0.4)"
            stroke-width="2.5" />

      <!-- Back of Right Arm -->
      <path d="M 538 440 C 570 450 560 540 485 540 C 465 540 450 520 455 500 C 460 480 500 460 538 440 Z" 
            fill="url(#armGradRight)"
            stroke="rgba(148, 163, 184, 0.4)"
            stroke-width="2.5" />

      <!-- LIL' HUGGED TOOTH -->
      <g id="little-tooth" transform="translate(400, 500)">
        <path d="
          M -35, -35 
          C -45, -35 -50, -10 -45, 10
          C -40, 30 -30, 45 -22, 45
          C -15, 45 -12, 30 0, 25
          C 12, 30 15, 45 22, 45
          C 30, 45 40, 30 45, 10
          C 50, -10 45, -35 35, -35
          C 20, -35 15, -25 0, -25
          C -15, -25 -20, -35 -35, -35 Z" 
          fill="url(#toothGrad)" 
          stroke="#0D9488" 
          stroke-width="2.5" />

        <path d="M -30 -25 C -20 -25 -15 -18 0 -18 C 15 -18 20 -25 30 -25 C 38 -25 40 -10 38 5 C 30 -10 15 -10 0 -10 C -15 -10 -30 -10 -38 5 C -40 -10 -38 -25 -30 -25 Z" 
              fill="#FFFFFF" opacity="0.85" />

        <path d="
          M -45, 10
          C -40, 30 -30, 45 -22, 45
          C -15, 45 -12, 30 0, 25
          C 12, 30 15, 45 22, 45
          C 30, 45 40, 30 45, 10
          Z" 
          fill="url(#toothShadow)" />

        <circle cx="-12" cy="-2" r="3.5" fill="#0D9488" />
        <circle cx="12" cy="-2" r="3.5" fill="#0D9488" />
        <path d="M -5 6 Q 0 11 5 6" fill="none" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round" />
      </g>

      <!-- Front Left Paws/Hands Overlay for Hugging Depth -->
      <path d="M 315 520 C 335 520 355 510 355 490 C 355 470 335 475 320 485 C 305 495 300 520 315 520 Z" 
            fill="#CBD5E1" opacity="0.25" />
      <path d="M 260 435 C 240 480 280 545 325 530 C 350 522 355 490 338 480 C 310 465 285 450 260 435 Z" 
            fill="url(#armGradLeft)"
            stroke="rgba(148, 163, 184, 0.4)"
            stroke-width="2.5" />

      <!-- Front Right Paws/Hands Overlay -->
      <path d="M 540 435 C 560 480 520 545 475 530 C 450 522 445 490 462 480 C 490 465 515 450 540 435 Z" 
            fill="url(#armGradRight)"
            stroke="rgba(148, 163, 184, 0.4)"
            stroke-width="2.5" />

      <!-- Highlights on Shoulders/Arms -->
      <ellipse cx="275" cy="455" rx="8" ry="18" fill="#FFFFFF" opacity="0.6" transform="rotate(-30, 275, 455)" />
      <ellipse cx="525" cy="455" rx="8" ry="18" fill="#FFFFFF" opacity="0.6" transform="rotate(30, 525, 455)" />
    </g>
  </g>
</svg>
